<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Reservation Manager</title>
  <style>
    :root{
      --bg:#0f1420;
      --panel:#151c2c;
      --panel-2:#1a2336;
      --text:#e7ecf7;
      --muted:#a8b2c8;
      --line:#2a3550;
      --blue:#4da3ff;
      --green:#2e7d32;
      --red:#d32f2f;
      --yellow:#f5b301;
    }
    *{box-sizing:border-box}
    body{
      margin:0;
      font-family:Arial, Helvetica, sans-serif;
      background:var(--bg);
      color:var(--text);
    }
    .container{
      max-width:1200px;
      margin:20px auto;
      padding:0 14px 40px;
    }
    h1{margin:0 0 14px}
    .tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
    .tab-btn{
      background:var(--panel);
      color:var(--text);
      border:1px solid var(--line);
      border-radius:10px;
      padding:9px 12px;
      cursor:pointer;
      font-weight:700;
    }
    .tab-btn.active{
      border-color:var(--blue);
      box-shadow:0 0 0 1px rgba(77,163,255,.5) inset;
    }
    .tab-content{display:none}
    .tab-content.active{display:block}
    .card{
      background:var(--panel);
      border:1px solid var(--line);
      border-radius:12px;
      padding:14px;
      margin-bottom:12px;
    }
    .label{
      display:block;
      font-size:.85rem;
      color:var(--muted);
      margin:4px 0 6px;
      font-weight:700;
    }
    input,select,button,textarea{
      font:inherit;
    }
    input,select,textarea{
      width:100%;
      background:var(--panel-2);
      color:var(--text);
      border:1px solid var(--line);
      border-radius:8px;
      padding:9px 10px;
      outline:none;
    }
    input:focus,select:focus,textarea:focus{
      border-color:var(--blue);
    }
    .row{display:grid;grid-template-columns:1fr 90px;gap:8px}
    .row-3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
    .btn{
      background:var(--blue);
      border:0;
      color:white;
      padding:9px 12px;
      border-radius:8px;
      cursor:pointer;
      font-weight:700;
    }
    .btn:hover{filter:brightness(1.05)}
    .btn-secondary{
      background:#2a3550;
    }
    .btn-red{
      background:var(--red);
    }
    .btn-green{
      background:var(--green);
    }
    .toolbar{
      display:flex;
      gap:8px;
      flex-wrap:wrap;
      margin-top:12px;
    }
    .mini{font-size:.82rem;color:var(--muted)}
    .field-row{
      display:grid;
      grid-template-columns:220px 1fr auto;
      gap:8px;
      align-items:center;
      padding:6px 0;
      border-bottom:1px dashed #2a3550;
    }
    .field-row:last-child{border-bottom:0}
    .field-row .k{color:var(--muted);font-size:.86rem}
    .field-row .v{word-break:break-word}
    .edit-btn{
      background:#2a3550;
      border:1px solid #3a4a6b;
      color:var(--text);
      border-radius:7px;
      padding:6px 10px;
      cursor:pointer;
      font-size:.83rem;
      font-weight:700;
    }
    .kanban{
      display:grid;
      grid-template-columns:1fr 1fr 1fr;
      gap:12px;
    }
    .kanban-col{
      background:var(--panel);
      border:1px solid var(--line);
      border-radius:12px;
      padding:12px;
      min-height:220px;
    }
    .kanban-col h3{
      margin:0 0 10px;
      font-size:1rem;
    }
    .badge{
      display:inline-block;
      padding:2px 8px;
      border-radius:999px;
      font-size:.74rem;
      font-weight:700;
      margin-left:6px;
      color:#0b1220;
      background:#c7d2eb;
    }
    .badge.booked{background:#b9dbff}
    .badge.confirmed{background:#b8f0c1}
    .badge.cancelled{background:#ffc0c0}
    .mail-grid{
      display:grid;
      grid-template-columns:1fr 1fr;
      gap:10px;
    }
    .full{grid-column:1/-1}
    @media (max-width:980px){
      .kanban{grid-template-columns:1fr}
      .field-row{grid-template-columns:1fr}
      .mail-grid{grid-template-columns:1fr}
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>New Reservation</h1>

    <div class="tabs">
      <button class="tab-btn active" data-tab="tab1">Search & Edit Records</button>
      <button class="tab-btn" data-tab="tab2">Kanban Board</button>
      <button class="tab-btn" data-tab="tab3">Create Reservation</button>
      <button class="tab-btn" data-tab="tab4">Send us an email</button>
    </div>

    <!-- Search/Edit -->
    <section id="tab1" class="tab-content active">
      <div class="card">
        <label class="label">Search</label>
        <div class="row">
          <input id="searchInput" type="text" placeholder="Search by any field..." />
          <button id="searchBtn" class="btn">Search</button>
        </div>
        <div class="toolbar">
          <button id="loadAllBtn" class="btn btn-secondary">Load All</button>
        </div>
      </div>
      <div id="results"></div>
    </section>

    <!-- Kanban -->
    <section id="tab2" class="tab-content">
      <div class="kanban">
        <div class="kanban-col">
          <h3>Booked <span class="badge booked">Default status for new reservations.</span></h3>
          <div id="colBooked"></div>
        </div>
        <div class="kanban-col">
          <h3>Confirmed <span class="badge confirmed">Staff-confirmed reservations.</span></h3>
          <div id="colConfirmed"></div>
        </div>
        <div class="kanban-col">
          <h3>Cancelled <span class="badge cancelled">Cancelled reservations.</span></h3>
          <div id="colCancelled"></div>
        </div>
      </div>
    </section>

    <!-- Create -->
    <section id="tab3" class="tab-content">
      <div class="card">
        <form id="createForm"></form>
        <div class="toolbar">
          <button id="createBtn" type="button" class="btn btn-green">Create</button>
          <button id="clearCreateBtn" type="button" class="btn btn-secondary">Clear</button>
        </div>
      </div>
    </section>

    <!-- Email -->
    <section id="tab4" class="tab-content">
      <div class="card">
        <div class="mini" style="margin-bottom:8px;">Destination inbox: <strong>cxdemo76@gmail.com</strong></div>
        <div class="mail-grid">
          <div>
            <label class="label">Customer Name</label>
            <input id="mailName" type="text" />
          </div>
          <div>
            <label class="label">Customer Email</label>
            <input id="mailFrom" type="email" />
          </div>
          <div class="full">
            <label class="label">Subject</label>
            <input id="mailSubject" type="text" />
          </div>
          <div class="full">
            <label class="label">Attachments</label>
            <input id="mailAttach" type="file" multiple />
          </div>
        </div>
        <div class="toolbar">
          <button id="mailSendBtn" type="button" class="btn btn-green">Send</button>
          <button id="mailCancelBtn" type="button" class="btn btn-secondary">Cancel</button>
          <button id="mailClearBtn" type="button" class="btn btn-secondary">Clear</button>
        </div>
      </div>
    </section>
  </div>

  <script src="app.js"></script>
</body>
</html>
